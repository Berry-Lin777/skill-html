<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>SEC Filing Tracker — Twitter Banner</title>
<style>
    :root {
      --navy: #071628;
      --navy-soft: #102b48;
      --ivory: #f7f4eb;
      --gold: #d7b66a;
    }

    * { box-sizing: border-box; }

    html,
    .finch-page {
      min-height: 100%;
      margin: 0;
    }

    .finch-page {
      display: grid;
      place-items: center;
      padding: 32px;
      background: #e8ebef;
      color: var(--ivory);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: min(1500px, 100%);
    }

    .banner {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 1;
      overflow: hidden;
      isolation: isolate;
      background: var(--navy);
      box-shadow: 0 22px 60px rgb(7 22 40 / 24%);
    }

    .banner__photo {
      position: absolute;
      inset: 0;
      z-index: -4;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 49%;
      filter: saturate(.74) contrast(1.04) brightness(.82);
      transform: scale(1.002);
    }

    .banner::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -3;
      background:
        linear-gradient(90deg,
          rgb(5 18 33 / 92%) 0%,
          rgb(5 18 33 / 78%) 31%,
          rgb(5 18 33 / 34%) 61%,
          rgb(5 18 33 / 12%) 100%),
        linear-gradient(0deg,
          rgb(4 13 24 / 54%) 0%,
          transparent 54%);
    }

    .banner::after {
      content: "";
      position: absolute;
      inset: 18px;
      z-index: 3;
      border: 1px solid rgb(215 182 106 / 48%);
      pointer-events: none;
    }

    .banner__texture {
      position: absolute;
      inset: 0;
      z-index: -2;
      opacity: .16;
      background-image:
        linear-gradient(rgb(255 255 255 / 6%) 1px, transparent 1px),
        linear-gradient(90deg, rgb(255 255 255 / 4%) 1px, transparent 1px);
      background-size: 52px 52px;
      mask-image: linear-gradient(90deg, black, transparent 66%);
    }

    .banner__content {
      position: absolute;
      left: 7.2%;
      top: 50%;
      width: 76%;
      transform: translateY(-50%);
    }

    .banner__rule {
      width: 112px;
      height: 3px;
      margin-bottom: 27px;
      background: var(--gold);
      box-shadow: 0 0 22px rgb(215 182 106 / 34%);
    }

    h1 {
      margin: 0;
      color: var(--ivory);
      font-size: clamp(42px, 6vw, 92px);
      font-weight: 600;
      line-height: .98;
      letter-spacing: -.032em;
      white-space: nowrap;
      text-shadow: 0 3px 24px rgb(0 0 0 / 38%);
    }

    .banner__accent {
      position: absolute;
      right: 5.5%;
      bottom: 10%;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow:
        18px 0 0 rgb(215 182 106 / 58%),
        36px 0 0 rgb(215 182 106 / 28%);
    }

    .note {
      width: min(1500px, 100%);
      margin-top: 14px;
      color: #455261;
      font: 12px/1.5 system-ui, sans-serif;
    }

    @media (max-width: 700px) {
      .finch-page { padding: 12px; }
      .banner::after { inset: 8px; }
      .banner__rule { width: 56px; height: 2px; margin-bottom: 11px; }
    }
  

html,body{margin:0;width:100%;} .finch-page{position:relative;isolation:isolate;width:100%;background-color:#fbfaf7;color:#24324a;}
img,video{max-width:100%!important;height:auto!important}.finch-media-ratio{aspect-ratio:auto 16 / 9}pre{white-space:pre-wrap;overflow-wrap:anywhere} .reveal{opacity:1!important;visibility:visible!important;transform:none!important}.finch-page::before,.finch-page::after{position:absolute;pointer-events:none}
.sheet-track{display:grid!important;grid-template-columns:minmax(0,1fr)!important;overflow:visible!important;height:auto!important;max-height:none!important;transform:none!important}.sheet-slide,.final-carousel .sheet-slide{display:block!important;position:relative!important;opacity:1!important;visibility:visible!important;width:100%!important;height:auto!important;margin-bottom:24px}.case-panel{display:block!important}.tab-buttons,[role="tablist"]{display:none!important}</style></head>
<body><div class="finch-page">
<main>
<section aria-label="SEC Filing Tracker Twitter banner" class="banner">
<img alt="U.S. Securities and Exchange Commission headquarters in Washington, D.C." class="banner__photo finch-media-ratio" height="853" src="https://pub-3a81bd32d33047139adc3bb6d51a57bf.r2.dev/sec-filing-tracker/banners/41be835d1ed03b61189824c9469e39ce904d4e9154bd8-41be835d1ed0.jpg" width="1280"/>
<div aria-hidden="true" class="banner__texture"></div>
<div class="banner__content">
<div aria-hidden="true" class="banner__rule"></div>
<h1>SEC Filing Tracker</h1>
</div>
<div aria-hidden="true" class="banner__accent"></div>
</section>
<p class="note">
      Photo: Ajay Suresh (ajay_suresh), CC BY 4.0, via Wikimedia Commons. Cropped and color-adjusted for this banner.
    </p>
</main>
</div></body>
</html>
